[workspace]
resolver = "2"
members = [
    "crates/protocol-types",
    "crates/encoding",
    "crates/domains",
    "crates/identity",
    "crates/merkle",
    "crates/snapshot-core",
    "crates/snapshot-ethereum",
    "crates/snapshot-solana",
    "crates/enrollment",
    "crates/paillier-adapter",
    "crates/ballot",
    "crates/tally",
    "crates/trustee-api",
    "crates/zk-ballot",
    "cli",
    "zk/methods",
    "zk/benchmarks",
    "integration-tests",
]
default-members = ["cli"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
authors = ["VeilGov Contributors"]
repository = "https://github.com/mark/paillier-snark"

[workspace.dependencies]
veilgov-protocol-types = { path = "crates/protocol-types" }
veilgov-encoding = { path = "crates/encoding" }
veilgov-domains = { path = "crates/domains" }
veilgov-identity = { path = "crates/identity" }
veilgov-merkle = { path = "crates/merkle" }
veilgov-snapshot-core = { path = "crates/snapshot-core" }
veilgov-snapshot-ethereum = { path = "crates/snapshot-ethereum" }
veilgov-snapshot-solana = { path = "crates/snapshot-solana" }
veilgov-enrollment = { path = "crates/enrollment" }
veilgov-paillier = { path = "crates/paillier-adapter" }
veilgov-ballot = { path = "crates/ballot" }
veilgov-tally = { path = "crates/tally" }
veilgov-trustee = { path = "crates/trustee-api" }
veilgov-zk-ballot = { path = "crates/zk-ballot" }

ark-ff = "0.5"
ark-bn254 = "0.5"
ark-std = "0.5"
sha2 = "0.10"
sha3 = "0.10"
hex = "0.4"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zeroize = { version = "1", features = ["derive"] }
rand = "0.8"
rand_core = { version = "0.6", features = ["getrandom"] }
num-bigint = { version = "0.4", features = ["rand"] }
num-traits = "0.2"
num-integer = "0.1"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
k256 = { version = "0.13", features = ["ecdsa", "sha256"] }
ed25519-dalek = { version = "2", features = ["rand_core"] }
alloy-primitives = "0.8"
proptest = "1"
criterion = "0.5"
bincode = "1.3"
risc0-zkvm = { version = "=3.0.6", features = ["prove"] }
